# Exp 003 — calibration factorial. Loss arms: soft-CE | +RPS | +perm-KL | +Brier; TS is applied post hoc by evaluate.py.
backbone: answerdotai/ModernBERT-base
readout: joint
finetune: full
data_dir: data/v0.1
out_dir: runs/exp003_ce
train_limit: 80000
per_dataset_cap: 10000
eval_limit: 3000
epochs: 1
batch_size: 16
grad_accum: 2
w_ce: 1.0
w_brier: 0.0
w_rps: 0.0
w_perm: 0.0
use_confidence_head: true
w_conf: 0.2
seed: 0
notes: "Primary endpoint: NLL on human-distribution slice (go_emotions votes / chaos_nli); secondary AURC."
