# Exp 002: causal decoder (Qwen3-0.6B-Base) on the same data/readout as joint v2; LoRA r=16 to fit 8 GB.
backbone: Qwen/Qwen3-0.6B-Base
readout: decoder
finetune: lora
marker: eos
pool: span_end
data_dir: data/v0.1
out_dir: runs/exp002_qwen06_lora
train_limit: 80000
per_dataset_cap: 10000
eval_limit: 3000
epochs: 1
batch_size: 4
grad_accum: 8
lr_backbone: 2.0e-4     # LoRA adapters
lr_head: 1.0e-4
layer_decay: 1.0
warmup_ratio: 0.05
w_ce: 1.0
w_rps: 0.5
w_perm: 0.1
max_state_tokens: 448
eval_every: 500
seed: 0
notes: "Exp 002 decoder arm; compare with runs/exp001_joint_full (joint v2, same data, same losses)."
