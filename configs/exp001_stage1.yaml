# Exp 001 Stage 1: same ablation, more data and epochs, stronger order/ordinal terms.
backbone: answerdotai/ModernBERT-base
readout: joint
finetune: full
data_dir: data/v0.1
out_dir: runs/exp001s1_joint_full
per_dataset_cap: 20000
eval_limit: 3000
epochs: 2
batch_size: 4
grad_accum: 8
lr_backbone: 2.0e-5
lr_head: 1.0e-4
layer_decay: 0.9
warmup_ratio: 0.05
w_ce: 1.0
w_rps: 1.0
w_perm: 0.3
marker: mask
pool: marker+span
max_state_tokens: 448
eval_every: 500
seed: 0
notes: "Stage 1 of Exp 001; primary endpoint unchanged (held-out-template Brier on calibration split)."
