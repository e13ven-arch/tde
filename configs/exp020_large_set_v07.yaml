# Exp 020 — candidate release v0.2: ModernBERT-large (GLiClass-large encoder init), set topology, data v0.7.
# Everything else is the Exp 010 recipe. perm-KL is identically zero under the tied topology, so it is off.
# Batch layout is for a 48 GB GPU (RTX 6000 Ada): 32 sequences per step, no gradient checkpointing.
backbone: checkpoints/gliclass-modern-large-encoder
readout: joint
topology: set
finetune: full
marker: mask
pool: marker+span
data_dir: data/v0.7
out_dir: runs/exp020_large_set_v07
per_dataset_cap: 15000
group_by_state: true
eval_limit: 3000
epochs: 1
batch_size: 32
grad_accum: 1
lr_backbone: 2.0e-5
lr_head: 1.0e-4
layer_decay: 0.9
warmup_ratio: 0.05
w_ce: 1.0
w_rps: 1.0
w_perm: 0.0
gradient_checkpointing: false
max_state_tokens: 1024
eval_every: 500
seed: 0
notes: "Target: JevBench public standard >= 0.75 with hard >= 0.34 (Laya: 0.73 / 0.34). Compare with Exp 010 (base, seq, v0.5) and Exp 019 (base, set, v0.5)."
