# Exp 001 — readout and fine-tuning ablation (Stage 0).
# Run once per readout: --readout joint|branch|biencoder, and per finetune: --finetune full|frozen80|lora
backbone: answerdotai/ModernBERT-base
readout: joint
finetune: full
data_dir: data/v0.1
out_dir: runs/exp001_joint_full
train_limit: 60000        # Stage 0 cap; raise for Stage 1
eval_limit: 3000
epochs: 1
batch_size: 16
grad_accum: 2
lr_backbone: 2.0e-5
lr_head: 1.0e-4
layer_decay: 0.9
warmup_ratio: 0.05
w_ce: 1.0
w_rps: 0.5
w_perm: 0.1
max_state_tokens: 448
eval_every: 500
seed: 0
notes: "Primary endpoint (pre-registered): Brier on the calibration split's held-out-template slice."
