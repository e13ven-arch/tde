# Exp 005 — data breadth: v0.1 datasets + rule-generated (policy/multihop/temporal) + LegalBench + HotpotQA + typed-decisions train.
# Same model and losses as Stage 1 joint v2; the only change is the training mixture. Compare on JevBench public tiers,
# typed-decisions test (specialist row), LegalBench held-out tasks, full-K sets and the v0.1 test set (regression check).
backbone: answerdotai/ModernBERT-base
readout: joint
finetune: full
marker: mask
pool: marker+span
data_dir: data/v0.2
out_dir: runs/exp005_breadth_joint
per_dataset_cap: 15000
group_by_state: true
eval_limit: 3000
epochs: 1
batch_size: 4
grad_accum: 8
lr_backbone: 2.0e-5
lr_head: 1.0e-4
layer_decay: 0.9
warmup_ratio: 0.05
w_ce: 1.0
w_rps: 1.0
w_perm: 0.3
max_state_tokens: 448
eval_every: 500
seed: 0
notes: "Pre-registered primary endpoint: JevBench public hard-tier accuracy vs runs/exp001s1_joint_full (Stage 1 baseline)."
