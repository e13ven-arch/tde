# Exp 018 — readout ablation on a second backbone (DeBERTa-v3-base, 184M, 512 positions).
backbone: checkpoints/deberta-v3-base
readout: joint
finetune: full
data_dir: data/v0.1
out_dir: runs/exp018_deberta
train_limit: 80000        # Stage 0 cap; raise for Stage 1
per_dataset_cap: 10000    # balanced mix over the 8 datasets
eval_limit: 3000
epochs: 1
batch_size: 4
grad_accum: 8
lr_backbone: 2.0e-5
lr_head: 1.0e-4
layer_decay: 0.9
warmup_ratio: 0.05
w_ce: 1.0
w_rps: 0.5
w_perm: 0.1
max_state_tokens: 320
max_total: 512
eval_every: 500
seed: 0
notes: "Primary endpoint (pre-registered): Brier on the calibration split's held-out-template slice."