# Training config of the released tde-typed-specialist-v0.1 (== Exp 014): tde-general-v0.1 + 8 epochs on the typed-decisions train split.
# same mode as openJev-verdict-2.0). Reported on eval_only/typed_decisions.test (2,000 decisions) as "specialist".
backbone: checkpoints/gliclass-modern-base-encoder
readout: joint
finetune: full
marker: mask
pool: marker+span
init_from: runs/exp010_fullk_v05
data_dir: data/typed_only
out_dir: runs/exp014_typed_specialist_long
eval_limit: 2000
epochs: 8
batch_size: 2
grad_accum: 16
lr_backbone: 5.0e-6
lr_head: 2.0e-5
layer_decay: 0.9
warmup_ratio: 0.1
w_ce: 1.0
w_rps: 1.0
w_perm: 0.3
group_by_state: true
max_state_tokens: 1024
gradient_checkpointing: true
eval_every: 50
seed: 0
notes: "Primary endpoint: typed-decisions test accuracy/Brier vs Jev 0.727/0.148 and verdict-2.0 0.771/0.064."