[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tde"
version = "0.1.0"
description = "Typed Decision Encoder: non-autoregressive calibrated decision models (state + question + candidates -> probability distribution)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.4",
  "transformers>=4.48",
  "datasets>=2.20",
  "numpy>=1.26",
  "pyyaml>=6",
  "tqdm>=4.66",
  "scikit-learn>=1.4",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
baselines = ["peft>=0.12", "sentencepiece>=0.2", "tiktoken>=0.7"]

[tool.setuptools.packages.find]
include = ["tde*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
